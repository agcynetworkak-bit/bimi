<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" id="Layer_1" version="1.2" baseProfile="tiny-ps">
        <title>Agency Network Logo</title>
        <rect width="500" height="500" fill="#111111"/>
        <!-- Large red A: left leg, right leg, crossbar -->
        <polygon points="15,420 115,60 155,60 255,420 210,420 185,340 85,340 60,420" fill="#cc0000"/>
        <polygon points="100,290 170,290 135,170" fill="#111111"/>
        <!-- Large red N: overlapping the A -->
        <polygon points="200,420 200,60 245,60 350,310 350,60 395,60 395,420 350,420 245,170 245,420" fill="#cc0000"/>
        <!-- White AGENCY NETWORK text cutting through the middle of the letters -->
        <rect x="0" y="218" width="500" height="64" fill="#111111" opacity="0.0"/>
        <text x="250" y="262" font-family="Arial Black,Arial,sans-serif" font-size="44" font-weight="900" fill="white" text-anchor="middle" letter-spacing="3">AGENCY NETWORK</text>
</svg>
